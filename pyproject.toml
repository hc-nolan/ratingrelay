[project]
name = "ratingrelay2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi-lifespan-manager>=0.1.4",
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
]

[tool.pylint.MASTER]
ignore = ["tests"]
disable = ["C0114","C0115","C0116","W1203","R0903","W0613", "C0103"]

[tool.fastapi]
entrypoint = "ratingrelay.main:app"

